<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Hosts Updater</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </div>
      <div class="title-section">
        <h1 class="title">GitHub Hosts</h1>
        <p class="subtitle">一键刷新 GitHub hosts 配置</p>
      </div>
    </header>

    <div class="status-section" id="statusSection">
      <div class="status-item">
        <span class="status-label">服务状态</span>
        <span class="status-value" id="serverStatus">检测中...</span>
      </div>
      <div class="status-item">
        <span class="status-label">更新状态</span>
        <span class="status-value" id="updateStatus">等待中</span>
      </div>
      <div class="status-item" id="lastRunItem" style="display:none;">
        <span class="status-label">上次更新</span>
        <span class="status-value" id="lastRun">-</span>
      </div>
    </div>

    <div class="action-section">
      <button class="btn-primary" id="refreshBtn" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span class="btn-text">立即刷新</span>
      </button>
    </div>

    <div class="log-section" id="logSection" style="display:none;">
      <div class="log-header">
        <span>更新日志</span>
        <button class="log-toggle" id="toggleLogBtn">展开</button>
      </div>
      <div class="log-content" id="logContent" style="display:none;"></div>
    </div>

    <div class="error-section" id="errorSection" style="display:none;">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="error-content">
        <p class="error-title">无法连接到本地服务</p>
        <p class="error-desc">请确保已启动 GitHub Hosts Server</p>
        <button class="btn-secondary" id="helpBtn">查看帮助</button>
      </div>
    </div>

    <div class="help-section" id="helpSection" style="display:none;">
      <h3>使用帮助</h3>
      <ol class="help-steps">
        <li>以管理员身份运行 <code>GitHubHostsServer.ps1</code></li>
        <li>保持服务窗口在后台运行</li>
        <li>点击上方"立即刷新"按钮更新 hosts</li>
        <li>刷新 GitHub 页面即可生效</li>
      </ol>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
